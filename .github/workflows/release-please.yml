name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    name: Create release PR or GitHub release
    uses: quokkify/project-toolkit/.github/workflows/release-please.yml@b13b2d1604dbde783d0ee23ac01f41c1853fd665 # v2.21.5
    with:
      mode: single
      config-backed-single: true
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
