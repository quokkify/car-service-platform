name: Allure report

on:
  workflow_run:
    workflows: [Validate, "PR Pipeline"]
    types: [completed]

permissions: {}

concurrency:
  group: allure-report-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  report:
    name: Generate and comment trusted Allure report
    uses: quokkify/ci-kit/.github/workflows/allure-publisher-core.yml@v3.0.0
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      source-workflow: "PR Pipeline"
      source-workflow-path: ".github/workflows/pr.yml"
      artifact-prefix: "allure-results-"
      artifact-mode: external
      minimum-artifacts: 5
      maximum-artifacts: 5
      skip-empty-artifacts: true
      config-file: .github/allure/allurerc.mjs
      categories-file: ".github/allure/categories.json"
      publish-pages: false
      managed-pages-layout: true
      history-path: allure-history/history.jsonl
      pages-url: ""
